apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: intelligent-healing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service:latest
          imagePullPolicy: Never
          env:
            - name: FAIL_MODE
              value: "normal"
          ports:
            - containerPort: 8000
